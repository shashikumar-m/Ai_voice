name: ai_voice_notes
description: AI-powered voice notes summarizer app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Audio Recording
  record: ^5.2.1
  audioplayers: ^6.0.0

  # File Picker
  file_picker: ^8.0.0

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Share
  share_plus: ^10.0.0

  # Storage & Preferences
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  web_socket_channel: ^3.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_web: ^1.3.0
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
